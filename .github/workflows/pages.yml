name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: [web/**, calc/**, package.json, package-lock.json, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -w calc && npm test -w web
      - run: npm run build -w web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Pages has no SPA fallback: serve the app for deep links like /classes/<id> on first visit.
      - run: cp web/dist/index.html web/dist/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
